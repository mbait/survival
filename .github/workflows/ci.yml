name: CI

on:
  push:
    branches: [ master, "port/sdl-linux" ]
  pull_request:
    branches: [ master ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.preset }}
    runs-on: ${{ matrix.runner }}
    env:
      VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
    strategy:
      fail-fast: false
      matrix:
        include:
          - preset: linux-gcc
            runner: ubuntu-latest
          - preset: linux-clang
            runner: ubuntu-latest
          - preset: windows-msvc
            runner: windows-latest

    steps:
      - uses: actions/checkout@v4

      # ---------------- Linux: apt deps + ccache ---------------------
      - name: Install apt packages (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libsdl2-dev libsdl2-image-dev libsdl2-ttf-dev libsdl2-gfx-dev \
            catch2 ninja-build ccache

      - name: ccache (Linux)
        if: runner.os == 'Linux'
        uses: hendrikmuhs/ccache-action@v1
        with:
          key: ${{ matrix.preset }}
          max-size: 200M

      # ---------------- Windows: vcpkg binary cache via GHA ----------
      - name: Export GHA cache env vars (Windows)
        if: runner.os == 'Windows'
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Set VCPKG_ROOT (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: echo VCPKG_ROOT=%VCPKG_INSTALLATION_ROOT%>>%GITHUB_ENV%

      # ---------------- configure / build / test via presets ---------
      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Test
        run: ctest --preset ${{ matrix.preset }}
