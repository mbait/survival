name: CI

on:
  push:
    branches: [ master, "port/sdl-linux" ]
  pull_request:
    branches: [ master ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # -----------------------------------------------------------------
  # Single static-analysis gate that all build jobs depend on. Runs
  # once per push regardless of how many compilers are in the build
  # matrix: clang-format + clang-tidy on Ubuntu.
  # -----------------------------------------------------------------
  check:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # We need history back to the previous tip / PR base so the
          # ci-lint-scope.sh diff can see which files changed.
          fetch-depth: 0

      - name: Determine lint scope
        id: scope
        env:
          PR_BASE_SHA:  ${{ github.event.pull_request.base.sha }}
          EVENT_BEFORE: ${{ github.event.before }}
        run: bash scripts/ci-lint-scope.sh

      - name: Install LLVM + SDL2 + Catch2
        if: steps.scope.outputs.mode != 'none'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
              clang-format-18 clang-tidy-18 \
              libsdl2-dev libsdl2-image-dev libsdl2-ttf-dev libsdl2-gfx-dev \
              catch2 ninja-build
          sudo update-alternatives --install /usr/bin/clang-format clang-format \
              /usr/bin/clang-format-18 100
          sudo update-alternatives --install /usr/bin/clang-tidy clang-tidy \
              /usr/bin/clang-tidy-18 100
          sudo update-alternatives --install /usr/bin/run-clang-tidy run-clang-tidy \
              /usr/bin/run-clang-tidy-18 100

      - name: clang-format --dry-run --Werror
        if: steps.scope.outputs.mode != 'none'
        env:
          MODE:          ${{ steps.scope.outputs.mode }}
          CHANGED_FILES: ${{ steps.scope.outputs.changed_files }}
        run: |
          if [ "$MODE" = "all" ]; then
              mapfile -t FILES < <(find . -type f \( -name '*.cpp' -o -name '*.h' \) \
                  -not -path './build/*' -not -path './.git/*' \
                  -not -path './d3dg*/*' -not -path './a/*' \
                  -not -path './Debug/*' -not -path './Release/*' \
                  -not -path './builds/*')
          else
              read -ra FILES <<< "$CHANGED_FILES"
          fi
          clang-format --version
          printf 'checking %d file(s):\n' "${#FILES[@]}"
          printf '  %s\n' "${FILES[@]}"
          clang-format --dry-run --Werror "${FILES[@]}"

      - name: CMake configure (for compile_commands.json)
        if: steps.scope.outputs.mode != 'none'
        run: cmake --preset linux-gcc

      - name: clang-tidy
        if: steps.scope.outputs.mode != 'none'
        env:
          MODE:               ${{ steps.scope.outputs.mode }}
          CPP_FILES:          ${{ steps.scope.outputs.cpp_files }}
          ANY_HEADER_CHANGED: ${{ steps.scope.outputs.any_header_changed }}
        run: |
          # WarningsAsErrors='*' in .clang-tidy means any diagnostic
          # under the enabled check set is a non-zero exit code.
          if [ "$MODE" = "all" ] || [ "$ANY_HEADER_CHANGED" = "true" ]; then
              # A header change could affect every TU that includes it;
              # we can't statically know which, so lint every .cpp.
              mapfile -t FILES < <(find . -type f -name '*.cpp' \
                  -not -path './build/*' -not -path './tests/*')
          else
              read -ra ALL_CPP <<< "$CPP_FILES"
              FILES=()
              for f in "${ALL_CPP[@]}"; do
                  [[ "$f" == tests/* || "$f" == build/* ]] && continue
                  FILES+=("$f")
              done
              if [ "${#FILES[@]}" -eq 0 ]; then
                  echo "all changed .cpp files are tests/ — skipping clang-tidy"
                  exit 0
              fi
          fi
          clang-tidy --version
          printf 'linting %d TU(s):\n' "${#FILES[@]}"
          printf '  %s\n' "${FILES[@]}"
          run-clang-tidy -p build/linux-gcc -quiet "${FILES[@]}"

  build:
    name: ${{ matrix.preset }}
    needs: check
    runs-on: ${{ matrix.runner }}
    env:
      VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
    strategy:
      fail-fast: false
      matrix:
        include:
          - preset: linux-gcc
            runner: ubuntu-latest
          - preset: linux-clang
            runner: ubuntu-latest
          - preset: windows-msvc
            runner: windows-latest

    steps:
      - uses: actions/checkout@v4

      # ---------------- Linux: apt deps + ccache ---------------------
      - name: Install apt packages (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libsdl2-dev libsdl2-image-dev libsdl2-ttf-dev libsdl2-gfx-dev \
            catch2 ninja-build ccache

      - name: ccache (Linux)
        if: runner.os == 'Linux'
        uses: hendrikmuhs/ccache-action@v1
        with:
          key: ${{ matrix.preset }}
          max-size: 200M

      # ---------------- Windows: vcpkg binary cache via GHA ----------
      - name: Export GHA cache env vars (Windows)
        if: runner.os == 'Windows'
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Set VCPKG_ROOT (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: echo VCPKG_ROOT=%VCPKG_INSTALLATION_ROOT%>>%GITHUB_ENV%

      # ---------------- configure / build / test via presets ---------
      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Test
        run: ctest --preset ${{ matrix.preset }}
