name: CI

on:
  push:
    branches: [ master, "port/sdl-linux" ]
  pull_request:
    branches: [ master ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-gcc
            runner: ubuntu-latest
            cxx: g++
          - name: linux-clang
            runner: ubuntu-latest
            cxx: clang++
          - name: windows-msvc
            runner: windows-latest

    steps:
      - uses: actions/checkout@v4

      # ---------------------------------------------------------------
      # Linux: SDL2 deps from apt + use system Catch2 if available.
      # ---------------------------------------------------------------
      - name: Install SDL2 deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libsdl2-dev libsdl2-image-dev libsdl2-ttf-dev libsdl2-gfx-dev \
            ninja-build
          # Catch2 is fetched via CMake FetchContent (Ubuntu 24.04 noble
          # dropped libcatch2-dev from the default repos).

      - name: Configure (Linux)
        if: runner.os == 'Linux'
        env:
          CXX: ${{ matrix.cxx }}
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      # ---------------------------------------------------------------
      # Windows: vcpkg manifest mode picks up vcpkg.json automatically.
      # The vcpkg + MSVC tooling is preinstalled on windows-latest; we
      # just point CMake at its toolchain file.
      # ---------------------------------------------------------------
      - name: Configure (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          cmake -S . -B build ^
            -DCMAKE_BUILD_TYPE=Release ^
            -DCMAKE_TOOLCHAIN_FILE=%VCPKG_INSTALLATION_ROOT%\scripts\buildsystems\vcpkg.cmake

      # ---------------------------------------------------------------
      - name: Build
        run: cmake --build build --config Release

      - name: Test
        run: ctest --test-dir build --output-on-failure --build-config Release
